
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple weather forecast app using OpenWeatherMap API" />
  <title>Weather Forecast App</title>

  <link rel="stylesheet" href="style.css" />
  
  <script
    src="https://kit.fontawesome.com/b75e553fb4.js"
    crossorigin="anonymous"
    defer
  ></script>
 
  <script src="script.js" defer></script>
</head>
<body>

  <div id="loader" class="loader hidden" aria-hidden="true" role="status" aria-live="polite">
    <span class="visually-hidden">Loading...</span>
  </div>

 
  <div class="video-container" aria-hidden="true">
    <video autoplay muted loop class="bg-video">
   
      <source class="bg-src" src="" type="video/mp4" />
      
      Your browser does not support the video tag.
    </video>
    <div class="overlay"></div>
  </div>

  
  <main class="wrapper hidden" role="main">
   
    <header class="top-ctn">
      <div class="search-ctn">
        <label for="city-search" class="visually-hidden">Search city</label>
        <input
          type="text"
          id="city-search"
          class="search-input"
          placeholder="Enter city..."
          aria-label="Search for city"
        />
        <button class="search-btn" aria-label="Search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        </button>
      </div>
      <div class="mode-ctn">
        <label for="mode-select" class="visually-hidden">Select unit</label>
        <select id="mode-select" class="mode-select" aria-label="Select temperature unit">
          <option value="celsius" selected>°C</option>
          <option value="fahrenheit">°F</option>
        </select>
      </div>
    </header>

   
    <section class="main">
      <h1 class="location-name" aria-live="polite"></h1>
      <p class="country-name"></p>
      <div class="main-subDisplay">
        <div class="weather-icon-wrapper">
          <img
            src=""
            alt=""
            class="weather-condition-icon"
          />
        </div>
        <p class="temp-value" aria-live="polite"></p>
      </div>
      <p class="weather-condition-text" aria-live="polite"></p>
    </section>

    
    <footer class="bottom-ctn">
      <h3 id="time" aria-live="polite"></h3>
      <p id="date"></p>
    </footer>
  </main>

  
  <style>
    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</body>
</html>
